name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run guard
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  # The Go port (see docs/go-migration). Race detector on, all three systems: path separators and file watching differ.
  go:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - run: go vet ./...
      - name: gofmt
        if: runner.os != 'Windows'
        run: test -z "$(gofmt -l .)"
      - run: go test -race -count=1 ./...

  # The TypeScript API, vault and UI-serving tests, run against the Go server (go/cmd/ck-server).
  go-contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - run: npm ci
      - run: npm run test:go-contract

  # Builds the Go + Wails app and its installers on each system, then smoke-tests the built app with its window hidden
  # (the real UI loads, calls the in-process API, and receives a live update after a hand edit).
  app:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - name: Linux build and test packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev xvfb
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.48.0
      - name: NSIS (Windows setup installer)
        if: runner.os == 'Windows'
        run: |
          choco install nsis --version 3.11.0 -y --no-progress
          echo "C:\Program Files (x86)\NSIS" >> $env:GITHUB_PATH
      - run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.17.1
      - run: npm ci
      - run: node scripts/package-app.mjs 0.0.0-ci
      - name: Smoke test (Linux, virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a node scripts/smoke-app.mjs
      - name: Smoke test
        if: runner.os != 'Linux'
        run: node scripts/smoke-app.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: go-app-${{ matrix.os }}
          path: release-go/*
          retention-days: 7

  # Drives the real Electron app (built, not packaged): first run, import, study, restart, security checks.
  e2e:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run desktop:build
      - name: e2e (Linux, virtual display)
        if: runner.os == 'Linux'
        run: xvfb-run -a npx playwright test
      - name: e2e
        if: runner.os != 'Linux'
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-traces-${{ matrix.os }}
          path: test-results/
          retention-days: 7
